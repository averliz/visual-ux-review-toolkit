name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # verify-skills.mjs: byte-identical browser-tools.md copies + `npx skills` discovers both skills
      - run: node scripts/verify-skills.mjs
